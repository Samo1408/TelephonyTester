# Pixel Tester device configuration
# Format: KEY=VALUE  (lines starting with # are comments)

# ===== Master switch =====
spoofDevice=true

# ===== Property hook toggles =====
# Build/System/Product are usually safe.
# Vendor/ODM hooks CAN cause black screens for native apps - keep them OFF
# unless you really need them. Re-enable per-app if needed.
hookBuildProperties=true
hookSystemProperties=true
hookVendorProperties=false
hookOdmProperties=false
hookProductProperties=true
hookDebugProperties=true

# Verbose log to logcat (PixelTester / PixelTester-J tags)
DEBUG=false

# ===== Allowed apps =====
# Comma-separated. Empty = spoof NO app. Use "*" to spoof every app.
allowedApps=

