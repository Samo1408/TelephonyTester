# Pixel Tester device configuration
# Format: KEY=VALUE  (lines starting with # are comments)

# ===== Master switch =====
spoofDevice=true

# ===== Property hook toggles =====
# Build/System/Product are usually safe.
# Vendor/ODM hooks CAN cause black screens for native apps - keep them OFF
# unless you really need them. Re-enable per-app if needed.
hookBuildProperties=true
hookSystemProperties=true
hookVendorProperties=false
hookOdmProperties=false
hookProductProperties=true
hookDebugProperties=true

# ===== Identity / network hook toggles (phase 2) =====
# Each toggle controls a separate Java/native hook for a single identity
# value. Leave them OFF until you have tested per-app — enabling several at
# once is the most common cause of black screens / login failures.
hookSerial=false
hookAndroidId=false
hookGsfId=false
hookDrmId=false
hookImei=false
hookWifiMac=false
hookWifiInfo=false
hookCarrier=false
hookPhoneNumber=false

# Verbose log to logcat (PixelTester / PixelTester-J tags)
DEBUG=false

# ===== Allowed apps =====
# Comma-separated. Empty = spoof NO app. Use "*" to spoof every app.
allowedApps=

# ===== Default device: Pixel 9 Pro =====
# Updated using the current official Android Developers Pixel build family.
brand=google
manufacturer=Google
model=Pixel 9 Pro
productName=caiman
deviceCode=caiman
board=caiman
hardware=caiman
boardPlatform=zumapro

buildFingerprint=google/caiman/caiman:17/CP21.260330.008/CP21.260330.008:user/release-keys
buildId=CP21.260330.008
buildDisplayId=CP21.260330.008
buildIncremental=CP21.260330.008
buildRelease=17
buildSdk=37
securityPatch=2026-04-05
buildDescription=caiman-user 17 CP21.260330.008 release-keys
buildFlavor=caiman-user
buildProduct=caiman
buildCharacteristics=nosdcard

screenWidth=1280
screenHeight=2856
screenDensity=495

socModel=Google Tensor G4
socManufacturer=Google

bootloader=
baseband=

